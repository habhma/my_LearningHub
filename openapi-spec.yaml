          example: class
        - name: classLevel
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
          description: Required if type=class
          example: 8
        - name: schoolName
          in: query
          schema:
            type: string
          description: Required if type=school
          example: Delhi Public School
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Leaderboard retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      leaderboard:
                        type: array
                        items:
                          type: object
                          properties:
                            rank:
                              type: integer
                              example: 1
                            userId:
                              type: integer
                              example: 123
                            fullName:
                              type: string
                              example: John Doe
                            schoolName:
                              type: string
                              example: Delhi Public School
                            totalPoints:
                              type: integer
                              example: 5420
                            badgesEarned:
                              type: integer
                              example: 12
                            avatarUrl:
                              type: string
                              nullable: true
                              example: https://cdn.studentassessment.com/avatars/123.jpg
                      currentUserRank:
                        type: integer
                        description: Current user's rank in this leaderboard
                        example: 15
                      totalUsers:
                        type: integer
                        example: 250
