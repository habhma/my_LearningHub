                        type: string
                        format: date-time
                        example: "2026-07-18T10:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /gamification/badges:
    get:
      tags:
        - Gamification
      summary: Get user badges
      description: Get all badges earned by current user
      operationId: getUserBadges
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Badges retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      badges:
                        type: array
                        items:
                          type: object
                          properties:
                            badgeId:
                              type: integer
                              example: 1
                            badgeName:
                              type: string
                              example: 7-Day Streak
                            badgeCode:
                              type: string
                              example: STREAK_7
                            description:
                              type: string
                              example: Practice for 7 consecutive days
                            iconUrl:
                              type: string
                              example: https://cdn.studentassessment.com/badges/streak_7.svg
                            rarity:
                              type: string
                              enum: [common, rare, epic, legendary]
                              example: rare
                            earnedAt:
                              type: string
                              format: date-time
                              example: "2026-07-15T14:30:00Z"
                      totalBadges:
                        type: integer
                        example: 8
        '401':
          $ref: '#/components/responses/Unauthorized'

  /gamification/points:
    get:
      tags:
        - Gamification
      summary: Get points balance
      description: Get current user's points balance and transaction history
      operationId: getPointsBalance
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Points balance retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      currentBalance:
                        type: integer
                        example: 3250
                      totalEarned:
                        type: integer
                        example: 5000
                      totalRedeemed:
                        type: integer
                        example: 1750
                      transactions:
                        type: array
                        items:
                          type: object
                          properties:
                            transactionId:
                              type: integer
                              example: 10001
                            points:
                              type: integer
                              description: Positive for earn, negative for redeem
                              example: 10
                            transactionType:
                              type: string
                              example: correct_answer
                            description:
                              type: string
                              example: Answered question correctly
                            balanceAfter:
                              type: integer
                              example: 3250
                            createdAt:
                              type: string
                              format: date-time
                              example: "2026-07-18T09:15:00Z"
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /gamification/points/redeem:
    post:
      tags:
        - Gamification
      summary: Redeem points
      description: Redeem points to unlock additional content (max 20% of payment made)
      operationId: redeemPoints
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemType
                - itemId
                - points
              properties:
                itemType:
                  type: string
                  enum: [mock_test, question_pack, explanation]
                  example: mock_test
                itemId:
                  type: integer
                  example: 1001
                points:
                  type: integer
                  minimum: 1
                  example: 500
      responses:
        '200':
          description: Points redeemed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Points redeemed successfully
                  data:
                    type: object
                    properties:
                      transactionId:
                        type: integer
                        example: 10002
                      pointsRedeemed:
                        type: integer
                        example: 500
                      newBalance:
                        type: integer
                        example: 2750
                      itemUnlocked:
                        type: object
                        properties:
                          type:
                            type: string
                            example: mock_test
                          id:
                            type: integer
                            example: 1001
                          name:
                            type: string
                            example: Class 8 Math Olympiad Mock 2
        '400':
          description: Insufficient points or redemption limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error:
                  code: INSUFFICIENT_POINTS
                  message: You don't have enough points for this redemption
        '401':
          $ref: '#/components/responses/Unauthorized'

