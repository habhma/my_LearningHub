  /admin/configuration/subjects:
    get:
      tags:
        - Configuration
      summary: List all subjects (Admin)
      description: Get all subjects including inactive ones
      operationId: listSubjects
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Subjects retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      subjects:
                        type: array
                        items:
                          type: object
                          properties:
                            subjectId:
                              type: integer
                              example: 1
                            subjectName:
                              type: string
                              example: Mathematics
                            subjectCode:
                              type: string
                              example: MATH
                            description:
                              type: string
                              example: All mathematical topics
                            colorHex:
                              type: string
                              example: "#FF6B6B"
                            isActive:
                              type: boolean
                              example: true
                            displayOrder:
                              type: integer
                              example: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Configuration
      summary: Create new subject (Admin only)
      description: Add a new subject to the platform (configuration-driven)
      operationId: createSubject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subjectName
                - subjectCode
              properties:
                subjectName:
                  type: string
                  maxLength: 100
                  example: Science
                subjectCode:
                  type: string
                  maxLength: 50
                  example: SCIENCE
                description:
                  type: string
                  example: Physics, Chemistry, Biology
                colorHex:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
                  example: "#4CAF50"
                displayOrder:
                  type: integer
                  example: 2
      responses:
        '201':
          description: Subject created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Subject created successfully
                  data:
                    type: object
                    properties:
                      subjectId:
                        type: integer
                        example: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Subject code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from login endpoint

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    LimitParam:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

  schemas:
    User:
      type: object
      properties:
        userId:
          type: integer
          example: 123
        email:
          type: string
          format: email
          example: student@example.com
        role:
          type: string
          enum: [student, admin, teacher, parent]
          example: student
        emailVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-06-15T10:30:00Z"

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            fullName:
              type: string
              example: John Doe
            schoolName:
              type: string
              example: Delhi Public School
            classLevel:
              type: integer
              example: 8
            boardId:
              type: integer
              example: 1
            boardName:
              type: string
              example: CBSE
            parentEmail:
              type: string
              nullable: true
              example: parent@example.com
            avatarUrl:
              type: string
              nullable: true
              example: https://cdn.studentassessment.com/avatars/123.jpg
            bio:
              type: string
              nullable: true
              example: Love solving math problems
            preferences:
              type: object
              example:
                theme: dark
                emailNotifications: true

    QuestionSummary:
      type: object
      properties:
        questionId:
          type: integer
          example: 456
        questionText:
          type: string
          example: What is the value of x in 2x + 5 = 15?
        subjectName:
          type: string
          example: Mathematics
        topicName:
          type: string
          example: Linear Equations
        difficultyLevel:
          type: string
          example: Medium
        typeName:
          type: string
          example: Multiple Choice Question
        classLevel:
          type: integer
          example: 8
        marks:
          type: number
          format: float
          example: 1.0
        successRate:
          type: number
          format: float
          nullable: true
          example: 67.5

    QuestionDetail:
      allOf:
        - $ref: '#/components/schemas/QuestionSummary'
        - type: object
          properties:
            questionHtml:
              type: string
              nullable: true
              example: <p>What is the value of <strong>x</strong> in 2x + 5 = 15?</p>
            questionImageUrl:
              type: string
              nullable: true
              example: https://cdn.studentassessment.com/questions/q456.jpg
            options:
              type: array
              items:
                type: object
                properties:
                  optionId:
                    type: integer
                    example: 1823
                  optionText:
                    type: string
                    example: x = 5
                  optionOrder:
                    type: integer
                    example: 1
            timeLimitSeconds:
              type: integer
              example: 180
            tags:
              type: array
              items:
                type: string
              example: ["algebra", "linear-equations"]

    QuestionCreate:
      type: object
      required:
        - questionText
        - typeId
        - difficultyId
        - subjectId
        - classLevel
        - examCategoryId
      properties:
        questionText:
          type: string
          minLength: 10
          example: What is the value of x in 2x + 5 = 15?
        questionHtml:
          type: string
          example: <p>What is the value of <strong>x</strong> in 2x + 5 = 15?</p>
        typeId:
          type: integer
          example: 1
        difficultyId:
          type: integer
          example: 2
        subjectId:
          type: integer
          example: 1
        topicId:
          type: integer
          example: 5
        classLevel:
          type: integer
          minimum: 1
          maximum: 10
          example: 8
        examCategoryId:
          type: integer
          example: 1
        correctAnswer:
          type: string
          description: For MCQ/True-False/Numerical
          example: "1823"
        correctAnswerData:
          type: object
          description: For MSQ (array of option IDs)
          example: {"optionIds": [1823, 1824]}
        options:
          type: array
          description: Required for MCQ/MSQ/True-False
          items:
            type: object
            required:
              - optionText
              - isCorrect
            properties:
              optionText:
                type: string
                example: x = 5
              optionOrder:
                type: integer
                example: 1
              isCorrect:
                type: boolean
                example: true
        explanation:
          type: object
          required:
            - explanationText
          properties:
            explanationText:
              type: string
              example: To solve 2x + 5 = 15, subtract 5 from both sides to get 2x = 10, then divide by 2 to get x = 5
            explanationHtml:
              type: string
              example: <p>To solve 2x + 5 = 15...</p>
        timeLimitSeconds:
          type: integer
          default: 180
          example: 180
        marks:
          type: number
          format: float
          default: 1.0
          example: 1.0
        tags:
          type: array
          items:
            type: string
          example: ["algebra", "linear-equations"]

    TestResult:
      type: object
      properties:
        attemptId:
          type: integer
          example: 1001
        testId:
          type: integer
          example: 5001
        status:
          type: string
          example: completed
        totalQuestions:
          type: integer
          example: 20
        attemptedQuestions:
          type: integer
          example: 18
        correctAnswers:
          type: integer
          example: 15
        wrongAnswers:
          type: integer
          example: 3
        unattempted:
          type: integer
          example: 2
        score:
          type: number
          format: float
          example: 15.0
        maxScore:
          type: number
          format: float
          example: 20.0
        percentage:
          type: number
          format: float
          example: 75.0
        timeTakenSeconds:
          type: integer
          example: 1800
        startedAt:
          type: string
          format: date-time
          example: "2026-07-18T10:00:00Z"
        submittedAt:
          type: string
          format: date-time
          example: "2026-07-18T10:30:00Z"
        pointsEarned:
          type: integer
          example: 150
        responses:
          type: array
          items:
            type: object
            properties:
              questionId:
                type: integer
                example: 456
              questionText:
                type: string
                example: What is 2 + 2?
              isCorrect:
                type: boolean
                example: true
              marksAwarded:
                type: number
                format: float
                example: 1.0
              timeTakenSeconds:
                type: integer
                example: 45
              explanation:
                type: string
                nullable: true
                description: Only shown for wrong answers
                example: null

    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 10
        totalItems:
          type: integer
          example: 195
        itemsPerPage:
          type: integer
          example: 20
        hasNextPage:
          type: boolean
          example: true
        hasPreviousPage:
          type: boolean
          example: false

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid request data
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: email
                  message:
                    type: string
                    example: Email is required

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Invalid request data
              details:
                - field: email
                  message: Invalid email format
                - field: password
                  message: Password must be at least 8 characters

    Unauthorized:
      description: Unauthorized - invalid or missing token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication required

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: You don't have permission to perform this action

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Too many requests. Please try again later.
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Request limit per time window
          example: 5
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in current window
          example: 0
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when limit resets
          example: 1721304000
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
          example: 900
